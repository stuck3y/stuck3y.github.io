<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f6f3ec" />
<title>rank</title>
<link rel="manifest" href="./manifest.webmanifest" />
<script src="../lib/pwa.js" defer></script>
<script src="../lib/sys.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --card: #fffdf8;
    --ink: #1a1a1c;
    --soft: #6e6e74;
    --faint: #dedbd2;
    --accent: #c8451d;
    --shade: 40, 30, 20;
    --serif: 'Fraunces', ui-serif, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a2825; --card: #36332f; --ink: #f2efe8; --soft: #a6a39b;
      --faint: #47443f; --accent: #f0805a; --shade: 0, 0, 0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a2825; --card: #36332f; --ink: #f2efe8; --soft: #a6a39b;
    --faint: #47443f; --accent: #f0805a; --shade: 0, 0, 0;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.45;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  ::selection { background: var(--accent); color: #fff; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .page { max-width: 600px; margin: 0 auto; padding: 56px 20px 140px; }

  h1 {
    margin: 0 0 28px;
    text-align: center;
    font-weight: 400;
    font-style: italic;
    font-size: 44px;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  /* ============ COMPOSER ============ */
  .composer { text-align: center; margin-bottom: 24px; }
  body[data-mode="list"]:not(.adding) .composer { display: none; }
  #paste {
    display: block;
    width: 100%;
    min-height: 44px;
    max-height: 50dvh;
    border: 0;
    border-bottom: 1px solid var(--faint);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 22px;
    line-height: 1.4;
    text-align: center;
    padding: 0 0 12px;
    outline: none;
    resize: none;
    transition: border-color .2s ease;
  }
  #paste::placeholder { color: var(--soft); font-style: italic; font-weight: 300; }
  #paste:focus { border-bottom-color: var(--ink); }
  .hint, #go {
    margin-top: 16px;
    font-style: italic;
    font-weight: 300;
    font-size: 15px;
    color: var(--soft);
  }
  #go { display: none; padding: 6px 12px; color: var(--accent); font-size: 17px; }
  .composer.filled #go { display: inline-block; }
  .composer.filled .hint { display: none; }

  /* ============ LIST ============ */
  ol {
    list-style: none;
    margin: 0;
    padding: 0;
    position: relative;
    counter-reset: rank;
  }
  .row {
    counter-increment: rank;
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 8px;
    padding: 14px 8px 14px 16px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(var(--shade), .07), 0 1px 2px rgba(var(--shade), .06);
    cursor: grab;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    --lift: 0;
  }
  /* the lifted shadow lives on its own layer so only opacity animates */
  .row::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: var(--lift);
    box-shadow: 0 2px 6px rgba(var(--shade), .10), 0 18px 44px -8px rgba(var(--shade), .34);
  }
  .row::before {
    content: counter(rank);
    flex: none;
    min-width: 1.5em;
    text-align: right;
    font-style: italic;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: var(--soft);
  }
  .row:first-child::before { color: var(--accent); font-weight: 400; }
  .row:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .row.fresh { animation: fresh .35s ease both; }
  @keyframes fresh { from { opacity: 0; } }

  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  /* grip: grabs instantly on touch (the rest of the row waits for a long-press) */
  .grip {
    flex: none;
    align-self: stretch;
    width: 40px;
    margin: -14px -8px -14px 0;
    touch-action: none;
    background:
      radial-gradient(circle, var(--soft) 1.4px, transparent 1.9px) calc(50% + 4px) 50% / 8px 8px;
    -webkit-mask: linear-gradient(#000, #000) center / 16px 24px no-repeat;
            mask: linear-gradient(#000, #000) center / 16px 24px no-repeat;
    opacity: .45;
  }

  body.holding, body.holding .row { cursor: grabbing; }

  /* ============ STRIP ============ */
  .strip {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 28px 20px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, transparent, var(--bg) 45%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2px 18px;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  body[data-mode="empty"] .strip { display: none; }
  body.holding .strip { opacity: .25; }
  .strip button {
    pointer-events: auto;
    padding: 6px 0;
    font-style: italic;
    font-weight: 300;
    font-size: 15px;
    color: var(--soft);
    transition: color .15s ease;
  }
  .strip button:hover { color: var(--ink); }
  .strip button:active { color: var(--accent); }
  .strip .sep { width: 1px; align-self: center; height: 14px; background: var(--faint); }

  /* ============ FEEDBACK (same language as act) ============ */
  .check-flash {
    position: fixed; top: 50%; left: 50%;
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--ink); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; z-index: 60;
    transform: translate(-50%, -50%) scale(.85);
    transition: opacity .15s ease, transform .25s cubic-bezier(.2,.9,.3,1.3);
    box-shadow: 0 12px 40px -8px rgba(0,0,0,.3);
  }
  .check-flash svg { width: 36px; height: 36px; }
  .check-flash.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .toast {
    position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg);
    padding: 8px 16px; border-radius: 999px;
    font-size: 14px; font-style: italic; white-space: nowrap;
    opacity: 0; pointer-events: none; z-index: 50;
    transform: translate(-50%, 8px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { margin-left: 10px; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body data-mode="empty">

<main class="page">
  <h1>rank</h1>

  <div class="composer" id="composer">
    <textarea id="paste" rows="1" placeholder="paste a list" aria-label="paste a list" autocomplete="off" spellcheck="false"></textarea>
    <div class="hint">one per line · bullets and numbers fall away</div>
    <button id="go">rank these</button>
  </div>

  <ol id="list" aria-label="ranked list"></ol>
</main>

<nav class="strip" id="strip" aria-label="copy and edit">
  <button data-fmt="numbered">numbered</button>
  <button data-fmt="plain">plain</button>
  <button data-fmt="bullets">bullets</button>
  <button data-fmt="json">json</button>
  <span class="sep" aria-hidden="true"></span>
  <button data-act="add">add</button>
  <button data-act="clear">clear</button>
</nav>

<div class="check-flash" id="check" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const list = $('#list'), composer = $('#composer'), paste = $('#paste');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* ============ storage ============ */
const KEY = 'rank:list';
const store = {
  load() {
    try { return (window.sys ? sys.storage.get(KEY, []) : JSON.parse(localStorage.getItem(KEY))) || []; }
    catch { return []; }
  },
  save() {
    const texts = items.map((it) => it.text);
    try { window.sys ? sys.storage.set(KEY, texts) : localStorage.setItem(KEY, JSON.stringify(texts)); } catch {}
  },
};

/* ============ items ============
   Each item owns its element and four springs. Every spring rests at 0,
   so "at rest" always means "exactly where the layout put it". */
let items = [];
const spring = () => ({ x: 0, v: 0 });

function makeItem(text) {
  const el = document.createElement('li');
  el.className = 'row';
  el.tabIndex = 0;
  const span = document.createElement('span');
  span.className = 'text';
  span.textContent = text;
  const grip = document.createElement('span');
  grip.className = 'grip';
  grip.setAttribute('aria-hidden', 'true');
  el.append(span, grip);
  const it = { text, el, top: 0, h: 0, y: spring(), x: spring(), rot: spring(), lift: spring(), moving: false };
  el.item = it;
  return it;
}

function measure() {
  for (const it of items) { it.top = it.el.offsetTop; it.h = it.el.offsetHeight; }
}

function setMode() {
  document.body.dataset.mode = items.length ? 'list' : 'empty';
  if (!items.length) document.body.classList.remove('adding');
}

function render(texts) {
  items = texts.map(makeItem);
  list.replaceChildren(...items.map((it) => it.el));
  setMode();
}

/* ============ paste in ============ */
const BULLET = /^\s*(?:[-*+•·‣◦–—✓✔☐☑]\s+|\d+[.)]\s+)?(?:\[[ xX]?\]\s+)?/;

function parse(raw) {
  const t = raw.trim();
  if (t[0] === '[') {
    try {
      const arr = JSON.parse(t);
      if (Array.isArray(arr)) return arr.map((v) => String(v && v.text != null ? v.text : v).trim()).filter(Boolean);
    } catch {}
  }
  return t.split(/\r?\n/).map((l) => l.replace(BULLET, '').trim()).filter(Boolean);
}

function ingest(raw) {
  const texts = parse(raw);
  if (!texts.length) return;
  const fresh = texts.map(makeItem);
  items.push(...fresh);
  list.append(...fresh.map((it) => it.el));
  setMode();
  document.body.classList.remove('adding');
  paste.value = '';
  syncComposer();
  paste.blur();
  // new rows rise into place, each a beat behind the last
  fresh.forEach((it, i) => {
    it.el.classList.add('fresh');
    it.el.addEventListener('animationend', () => it.el.classList.remove('fresh'), { once: true });
    it.y.x = 24 + Math.min(i, 12) * 10;
    it.moving = true;
  });
  store.save();
  wake();
}

function syncComposer() {
  composer.classList.toggle('filled', !!paste.value.trim());
  paste.style.height = 'auto';
  paste.style.height = paste.scrollHeight + 'px';
}

paste.addEventListener('input', syncComposer);
paste.addEventListener('paste', (e) => {
  if (paste.value.trim()) return; // mid-compose: let it paste as text
  e.preventDefault();
  e.stopPropagation();
  ingest(e.clipboardData.getData('text/plain'));
});
paste.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ingest(paste.value); }
});
$('#go').addEventListener('click', () => ingest(paste.value));
document.addEventListener('paste', (e) => {
  if (e.target === paste) return;
  const text = e.clipboardData && e.clipboardData.getData('text/plain');
  if (text) { e.preventDefault(); ingest(text); }
});

/* ============ physics ============
   One rAF loop. The held row tracks the pointer 1:1; everything else is a
   damped spring pulling back to 0, so any motion can be interrupted mid-flight. */
let held = null;       // item under the finger
let grab = null;       // { dx, dy } pointer offset inside the held row
let frame = 0, last = 0;
const pointer = { x: 0, y: 0, vx: 0, vy: 0, t: 0 };

const SLIDE = [520, 38];   // neighbours making room
const DROP  = [380, 27];   // released row finding its slot
const LIFT  = [420, 22];   // scale + shadow; underdamped so it lands with a thunk
const TILT  = [220, 20];

function step(s, target, dt, [k, c], eps) {
  if (calm) { s.x = target; s.v = 0; return false; }
  const n = Math.ceil(dt / 0.004), h = dt / n;
  for (let i = 0; i < n; i++) {
    s.v += (-k * (s.x - target) - c * s.v) * h;
    s.x += s.v * h;
  }
  if (Math.abs(s.x - target) < eps && Math.abs(s.v) < eps * 10) { s.x = target; s.v = 0; return false; }
  return true;
}

function paint(it) {
  const { x, y, rot, lift } = it, s = it.el.style;
  const still = !x.x && !y.x && !rot.x && !lift.x;
  s.transform = still ? '' :
    `translate3d(${x.x.toFixed(2)}px,${y.x.toFixed(2)}px,0) rotate(${rot.x.toFixed(3)}deg) scale(${(1 + lift.x * 0.035).toFixed(4)})`;
  s.setProperty('--lift', clamp(lift.x, 0, 1).toFixed(3));
  s.zIndex = it === held ? 3 : lift.x ? 2 : '';
}

function wake() {
  if (!frame) { last = performance.now(); frame = requestAnimationFrame(tick); }
}

function tick(now) {
  const dt = clamp((now - last) / 1000, 0.001, 1 / 30);
  last = now;
  let alive = false;

  if (held) {
    alive = true;
    autoscroll(dt);
    if (now - pointer.t > 60) { pointer.vx *= 0.8; pointer.vy *= 0.8; } // finger is resting
    held.x.x = give(pointer.x - grab.dx);
    held.y.x = pointer.y - grab.dy - list.getBoundingClientRect().top - held.top;
    reorder();
    step(held.lift, 1, dt, LIFT, 0.001);
    step(held.rot, calm ? 0 : clamp(pointer.vx * 0.006, -4, 4), dt, TILT, 0.001);
    paint(held);
  }

  for (const it of items) {
    if (it === held || !it.moving) continue;
    const settling = it.lift.x || it.x.x; // only a just-released row has these
    let busy = step(it.y, 0, dt, settling ? DROP : SLIDE, 0.05);
    busy = step(it.x, 0, dt, DROP, 0.05) || busy;
    busy = step(it.rot, 0, dt, TILT, 0.001) || busy;
    busy = step(it.lift, 0, dt, LIFT, 0.001) || busy;
    it.moving = busy;
    alive = alive || busy;
    paint(it);
  }

  frame = alive ? requestAnimationFrame(tick) : 0;
}

/* Swap `it` with its neighbour in direction `dir` (+1 down, -1 up) without
   anything visibly jumping: the neighbour is the DOM node that moves (never
   the one under the finger), then every row's spring absorbs the layout change. */
function swap(it, dir) {
  const i = items.indexOf(it), other = items[i + dir];
  if (!other) return false;
  const pair = [it, other], seen = pair.map((r) => r.top + r.y.x);
  list.insertBefore(other.el, dir > 0 ? it.el : it.el.nextSibling);
  items[i] = other; items[i + dir] = it;
  measure();
  pair.forEach((r, n) => { r.y.x = seen[n] - r.top; r.moving = true; });
  return true;
}

// The held row trades places once its leading edge crosses a neighbour's middle.
function reorder() {
  for (;;) {
    const i = items.indexOf(held);
    const top = held.top + held.y.x, bottom = top + held.h;
    const next = items[i + 1], prev = items[i - 1];
    if (next && bottom > next.top + next.h / 2) swap(held, 1);
    else if (prev && top < prev.top + prev.h / 2) swap(held, -1);
    else return;
  }
}

// Sideways the row has give, like a card on a rail: it follows, then resists.
const give = (d, limit = 120) => Math.sign(d) * (1 - 1 / (Math.abs(d) * 0.55 / limit + 1)) * limit;

function autoscroll(dt) {
  const edge = 90, vh = innerHeight;
  const up = edge - pointer.y, down = pointer.y - (vh - edge);
  const push = up > 0 ? -up : down > 0 ? down : 0;
  if (push) scrollBy(0, clamp(push / edge, -1.5, 1.5) * 900 * dt);
}

function track(x, y) {
  const now = performance.now(), dt = (now - pointer.t) / 1000;
  if (dt > 0 && dt < 0.1) {
    pointer.vx += ((x - pointer.x) / dt - pointer.vx) * 0.4;
    pointer.vy += ((y - pointer.y) / dt - pointer.vy) * 0.4;
  }
  pointer.x = x; pointer.y = y; pointer.t = now;
}

function pickUp(it, x, y) {
  if (held) return;
  measure();
  Object.assign(pointer, { x, y, vx: 0, vy: 0, t: performance.now() });
  grab = { dx: x, dy: y - list.getBoundingClientRect().top - it.top - it.y.x };
  it.x.v = it.y.v = 0;
  held = it;
  document.body.classList.add('holding');
  wake();
}

function drop() {
  if (!held) return;
  const it = held;
  held = null;
  // carry the throw into the landing
  it.x.v = clamp(pointer.vx, -2500, 2500);
  it.y.v = clamp(pointer.vy, -2500, 2500);
  if (!it.lift.x) it.lift.x = 0.001; // keeps it on the "landing" spring + above its neighbours
  it.moving = true;
  document.body.classList.remove('holding');
  store.save();
  wake();
}

/* ============ input: mouse / pen ============ */
const rowOf = (target) => { const el = target.closest && target.closest('.row'); return el ? el.item : null; };

list.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' || e.button !== 0) return;
  const it = rowOf(e.target);
  if (!it) return;
  e.preventDefault();
  pickUp(it, e.clientX, e.clientY);
});
addEventListener('pointermove', (e) => { if (held && e.pointerType !== 'touch') track(e.clientX, e.clientY); });
addEventListener('pointerup', (e) => { if (e.pointerType !== 'touch') drop(); });
addEventListener('pointercancel', (e) => { if (e.pointerType !== 'touch') drop(); });
addEventListener('blur', drop);

/* ============ input: touch ============
   The grip picks up instantly. Anywhere else on the row waits for a short
   hold, so a swipe still scrolls the page. */
const HOLD_MS = 170, SLOP = 8;
let touchId = null, pending = null;

const findTouch = (e) => [...e.changedTouches].find((t) => t.identifier === touchId);
const cancelPending = () => { if (pending) { clearTimeout(pending.timer); pending = null; } };

list.addEventListener('touchstart', (e) => {
  if (held || pending || e.touches.length > 1) return;
  const it = rowOf(e.target);
  if (!it) return;
  const t = e.changedTouches[0];
  touchId = t.identifier;
  if (e.target.closest('.grip')) { pickUp(it, t.clientX, t.clientY); return; }
  pending = {
    x: t.clientX, y: t.clientY,
    timer: setTimeout(() => { const p = pending; pending = null; pickUp(it, p.x, p.y); }, HOLD_MS),
  };
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  const t = findTouch(e);
  if (!t) return;
  if (pending) {
    if (Math.hypot(t.clientX - pending.x, t.clientY - pending.y) > SLOP) cancelPending();
    else { pending.x = t.clientX; pending.y = t.clientY; }
  } else if (held) {
    if (e.cancelable) e.preventDefault(); else return drop(); // the browser took the gesture
    track(t.clientX, t.clientY);
  }
}, { passive: false });

const touchDone = (e) => { if (findTouch(e)) { cancelPending(); drop(); touchId = null; } };
document.addEventListener('touchend', touchDone);
document.addEventListener('touchcancel', touchDone);
addEventListener('scroll', cancelPending, { passive: true });
list.addEventListener('contextmenu', (e) => e.preventDefault());

/* ============ input: keyboard ============
   ↑/↓ walks the list. ⌥ or ⇧ with ↑/↓ carries the row along. */
list.addEventListener('keydown', (e) => {
  const dir = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
  const it = rowOf(e.target);
  if (!dir || !it || held) return;
  e.preventDefault();
  if (e.altKey || e.shiftKey) {
    measure();
    if (!swap(it, dir)) return;
    it.lift.v = 9; // a little hop so the eye follows the row that moved
    it.el.scrollIntoView({ block: 'nearest' });
    store.save();
    wake();
  } else {
    const other = items[items.indexOf(it) + dir];
    if (other) other.el.focus();
  }
});

/* ============ copy out ============ */
const formats = {
  numbered: (t) => t.map((s, i) => `${i + 1}. ${s}`).join('\n'),
  plain:    (t) => t.join('\n'),
  bullets:  (t) => t.map((s) => `- ${s}`).join('\n'),
  json:     (t) => JSON.stringify(t, null, 2),
};

const actions = {
  add() {
    const on = document.body.classList.toggle('adding');
    if (on) { syncComposer(); scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' }); paste.focus({ preventScroll: true }); }
  },
  clear() {
    const before = items.map((it) => it.text);
    render([]);
    store.save();
    toast('cleared', 'undo', () => { render(before); store.save(); });
  },
};

$('#strip').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.act) return actions[b.dataset.act]();
  try {
    await navigator.clipboard.writeText(formats[b.dataset.fmt](items.map((it) => it.text)));
    flashCheck();
  } catch { toast('copy failed'); }
});

/* ============ feedback ============ */
function flashCheck() {
  const el = $('#check');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 900);
}

function toast(msg, action, fn) {
  const t = $('#toast');
  t.textContent = msg;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action;
    b.addEventListener('click', () => { t.classList.remove('show'); fn(); });
    t.append(b);
  }
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), action ? 5000 : 1400);
}

/* ============ init ============ */
addEventListener('DOMContentLoaded', () => {
  if (window.sys) sys.theme.init();
  render(store.load());
});
